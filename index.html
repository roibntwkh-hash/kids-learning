<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kids Learning · 快樂學習樂園</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--paper:#fbf3e6;--paper2:#f3e0c8;--ink:#4a3220;--ink-soft:#7a5c40;--accent:#d97642;--accent-deep:#b95a2c;--card:#fffaf1;--line:#e8d3b4;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Quicksand',sans-serif;color:var(--ink);min-height:100vh;
    background:radial-gradient(circle at 15% 12%,#fff6ea 0,transparent 45%),radial-gradient(circle at 85% 88%,#ffe9d2 0,transparent 50%),linear-gradient(160deg,var(--paper),var(--paper2));
    display:flex;flex-direction:column;align-items:center;padding:48px 18px 60px;}
  header{text-align:center;margin-bottom:34px;}
  .logo{font-size:52px;}
  h1{font-family:'Fredoka';font-weight:700;font-size:clamp(30px,8vw,46px);color:var(--accent-deep);margin-top:6px;}
  .sub{font-family:'Fredoka';font-weight:500;color:var(--ink-soft);letter-spacing:3px;text-transform:uppercase;font-size:13px;margin-top:4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;width:100%;max-width:720px;}
  a.card{text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-radius:22px;
    padding:26px 22px;box-shadow:0 6px 0 var(--line);transition:.15s;display:flex;flex-direction:column;gap:8px;}
  a.card:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--line),0 12px 24px -10px rgba(74,50,32,.3);border-color:var(--accent);}
  a.card:active{transform:translateY(3px);box-shadow:0 3px 0 var(--line);}
  .emoji{font-size:44px;}
  .title{font-family:'Fredoka';font-weight:700;font-size:22px;color:var(--accent-deep);}
  .desc{font-size:14px;color:var(--ink-soft);line-height:1.5;}
  .go{margin-top:auto;font-family:'Fredoka';font-weight:600;color:var(--accent);font-size:14px;}
  footer{margin-top:40px;font-size:12px;color:var(--ink-soft);font-weight:500;text-align:center;}
</style>
</head>
<body>
  <header>
    <div class="logo">🐾📚</div>
    <h1>快樂學習樂園</h1>
    <div class="sub">Kids Learning</div>
  </header>

  <div class="grid">
    <!-- 貓咪西洋棋：對應 chess/index.html -->
    <a class="card" href="./chess/">
      <div class="emoji">🐱♟️</div>
      <div class="title">貓咪西洋棋 3D</div>
      <div class="desc">立體貓咪棋盤,和「貓大師」下棋,還有賽後教學與棋譜記錄。</div>
      <div class="go">開始遊玩 →</div>
    </a>

    <!-- 快樂學習：對應 happy/index.html（可自行修改標題與說明） -->
    <a class="card" href="./happy/">
      <div class="emoji">🌈✏️</div>
      <div class="title">快樂學習</div>
      <div class="desc">（在這裡寫上這個作品的說明文字。）</div>
      <div class="go">進入 →</div>
    </a>

    <!-- 要新增作品時,複製上面一張卡片,改 href、emoji、標題、說明即可 -->
  </div>

  <footer>用 🐾 做成的學習樂園 · 點卡片進入各個小遊戲</footer>
</body>
</html>
